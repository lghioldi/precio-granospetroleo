name: Actualizar mercados

on:
  schedule:
    - cron: '4,19,34,49 * * * *'   # cada 15 minutos
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Consultar APIs
        run: node scripts/update.mjs
        env:
          OIL_API_KEY: ${{ secrets.OIL_API_KEY }}

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "mercados-bot"
          git config user.email "mercados-bot@users.noreply.github.com"
          git add site/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar cotizaciones"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
